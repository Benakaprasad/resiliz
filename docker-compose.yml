version: '3.8'

services:
  # Multi-arch PostgreSQL (Native s390x, arm64, amd64 support)
  postgres:
    image: postgres:16-alpine
    container_name: resiliz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: resiliz_db
      POSTGRES_USER: resiliz
      POSTGRES_PASSWORD: resiliz_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resiliz -d resiliz_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Apache Kafka (KRaft mode, no Zookeeper needed)
  kafka:
    image: apache/kafka:latest
    container_name: resiliz-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ResiliZ Core Backend (Simulator + AI Engine + FastAPI + Embedded React Dashboard)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resiliz-core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://resiliz:resiliz_secure_password@postgres:5432/resiliz_db
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data

volumes:
  postgres_data:

